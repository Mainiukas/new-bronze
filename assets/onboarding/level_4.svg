<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="A big industrial town with a railway viaduct, a steam train and many chimneys">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a26"/>
      <stop offset="0.55" stop-color="#8a4f25"/>
      <stop offset="1" stop-color="#c77a2e"/>
    </linearGradient>
  </defs>
  <rect width="240" height="150" fill="url(#sky)"/>
  <!-- heavy smoke -->
  <g fill="#6f675d" opacity="0.55">
    <circle cx="22" cy="30" r="10"/><circle cx="38" cy="20" r="12"/><circle cx="58" cy="14" r="11"/>
    <circle cx="92" cy="26" r="9"/><circle cx="104" cy="16" r="12"/><circle cx="124" cy="10" r="11"/>
    <circle cx="150" cy="28" r="8"/><circle cx="160" cy="18" r="11"/><circle cx="178" cy="12" r="10"/>
    <circle cx="206" cy="30" r="9"/><circle cx="218" cy="20" r="11"/><circle cx="234" cy="14" r="9"/>
  </g>
  <!-- far town -->
  <g fill="#3b2a20" stroke="#0e0a06" stroke-width="2" stroke-linejoin="round">
    <rect x="0" y="66" width="30" height="40"/><path d="M-2 68 L15 56 L32 68 Z"/>
    <rect x="34" y="58" width="36" height="48"/><rect x="74" y="70" width="26" height="36"/><path d="M72 72 L87 60 L102 72 Z"/>
    <rect x="104" y="54" width="40" height="52"/><rect x="148" y="66" width="30" height="40"/><path d="M146 68 L163 56 L180 68 Z"/>
    <rect x="182" y="58" width="34" height="48"/><rect x="218" y="68" width="24" height="38"/>
  </g>
  <!-- chimneys -->
  <g fill="#6b3e28" stroke="#0e0a06" stroke-width="2.5">
    <rect x="18" y="36" width="8" height="32"/><rect x="50" y="28" width="8" height="32"/><rect x="98" y="30" width="8" height="26"/>
    <rect x="120" y="24" width="9" height="32"/><rect x="156" y="36" width="8" height="32"/><rect x="200" y="32" width="8" height="28"/><rect x="228" y="36" width="7" height="34"/>
  </g>
  <!-- lit windows -->
  <g fill="#f2c043" opacity="0.9">
    <rect x="40" y="66" width="5" height="6"/><rect x="50" y="66" width="5" height="6"/><rect x="60" y="66" width="5" height="6"/><rect x="40" y="80" width="5" height="6"/><rect x="60" y="80" width="5" height="6"/>
    <rect x="110" y="62" width="5" height="6"/><rect x="120" y="62" width="5" height="6"/><rect x="130" y="62" width="5" height="6"/><rect x="110" y="76" width="5" height="6"/><rect x="130" y="76" width="5" height="6"/>
    <rect x="188" y="66" width="5" height="6"/><rect x="198" y="66" width="5" height="6"/><rect x="208" y="66" width="5" height="6"/><rect x="198" y="80" width="5" height="6"/>
    <rect x="6" y="76" width="5" height="6"/><rect x="154" y="76" width="5" height="6"/><rect x="80" y="80" width="5" height="6"/>
  </g>
  <!-- viaduct -->
  <g stroke="#0e0a06" stroke-width="2.5" stroke-linejoin="round">
    <path d="M0 98 H240 V150 H0 Z" fill="#7a4a2e"/>
    <path d="M8 150 V126 Q8 112 22 112 Q36 112 36 126 V150 Z M50 150 V126 Q50 112 64 112 Q78 112 78 126 V150 Z M92 150 V126 Q92 112 106 112 Q120 112 120 126 V150 Z M134 150 V126 Q134 112 148 112 Q162 112 162 126 V150 Z M176 150 V126 Q176 112 190 112 Q204 112 204 126 V150 Z M218 150 V126 Q218 112 232 112 Q246 112 246 126 V150 Z" fill="#2a1b12"/>
  </g>
  <rect x="0" y="96" width="240" height="4" fill="#3b2a20" stroke="#0e0a06" stroke-width="2"/>
  <!-- steam train -->
  <g stroke="#0e0a06" stroke-width="2.2" stroke-linejoin="round">
    <rect x="120" y="84" width="34" height="12" fill="#6d2a24"/>
    <rect x="156" y="82" width="30" height="14" fill="#6d2a24"/>
    <rect x="188" y="86" width="26" height="10" rx="4" fill="#2e2e33"/>
    <rect x="178" y="76" width="10" height="20" fill="#2e2e33"/>
    <rect x="200" y="78" width="5" height="9" fill="#2e2e33"/>
    <path d="M214 90 L220 96 H212 Z" fill="#b98c48"/>
  </g>
  <g fill="#f2c043"><rect x="126" y="87" width="5" height="4"/><rect x="136" y="87" width="5" height="4"/><rect x="162" y="86" width="5" height="4"/><rect x="172" y="86" width="5" height="4"/></g>
  <g fill="#1a120a" stroke="#b98c48" stroke-width="1.2">
    <circle cx="128" cy="97" r="2.6"/><circle cx="146" cy="97" r="2.6"/><circle cx="164" cy="97" r="2.6"/><circle cx="180" cy="97" r="2.6"/><circle cx="194" cy="97" r="3.2"/><circle cx="206" cy="97" r="3.2"/>
  </g>
  <!-- the engine's steam -->
  <g fill="#e2dbd0" opacity="0.7"><circle cx="203" cy="72" r="4"/><circle cx="196" cy="64" r="6"/><circle cx="184" cy="58" r="7"/><circle cx="168" cy="56" r="6"/></g>
</svg>
