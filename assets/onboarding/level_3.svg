<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="A cotton mill with two chimneys beside a canal with a narrowboat">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2226"/>
      <stop offset="0.6" stop-color="#5a3d2a"/>
      <stop offset="1" stop-color="#8a5a2c"/>
    </linearGradient>
    <linearGradient id="canal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4d4f"/>
      <stop offset="1" stop-color="#162729"/>
    </linearGradient>
  </defs>
  <rect width="240" height="150" fill="url(#sky)"/>
  <!-- smoke from both chimneys -->
  <g fill="#7f776c" opacity="0.5">
    <circle cx="70" cy="30" r="8"/><circle cx="80" cy="20" r="10"/><circle cx="94" cy="13" r="11"/><circle cx="112" cy="10" r="9"/>
    <circle cx="170" cy="36" r="7"/><circle cx="178" cy="25" r="9"/><circle cx="192" cy="17" r="10"/><circle cx="208" cy="14" r="8"/>
  </g>
  <path d="M0 96 Q60 84 120 92 T240 88 V150 H0 Z" fill="#2c2219"/>
  <!-- the mill -->
  <g stroke="#0e0a06" stroke-width="2.5" stroke-linejoin="round">
    <rect x="62" y="40" width="12" height="52" fill="#6b3e28"/>
    <rect x="59" y="37" width="18" height="5" fill="#3e2a1c"/>
    <rect x="162" y="46" width="11" height="46" fill="#6b3e28"/>
    <rect x="159" y="43" width="17" height="5" fill="#3e2a1c"/>
    <rect x="78" y="62" width="104" height="52" fill="#7a4f33"/>
    <path d="M74 64 L130 48 L186 64 Z" fill="#43301f"/>
  </g>
  <!-- rows of lit windows -->
  <g fill="#f2c043" stroke="#0e0a06" stroke-width="1.5">
    <rect x="86" y="70" width="8" height="10"/><rect x="100" y="70" width="8" height="10"/><rect x="114" y="70" width="8" height="10"/><rect x="128" y="70" width="8" height="10"/><rect x="142" y="70" width="8" height="10"/><rect x="156" y="70" width="8" height="10"/><rect x="170" y="70" width="6" height="10"/>
    <rect x="86" y="88" width="8" height="10"/><rect x="100" y="88" width="8" height="10"/><rect x="114" y="88" width="8" height="10" fill="#c98e3a"/><rect x="128" y="88" width="8" height="10"/><rect x="142" y="88" width="8" height="10" fill="#c98e3a"/><rect x="156" y="88" width="8" height="10"/><rect x="170" y="88" width="6" height="10"/>
  </g>
  <!-- towpath and canal -->
  <rect x="0" y="114" width="240" height="6" fill="#4a3a28" stroke="#0e0a06" stroke-width="2"/>
  <rect x="0" y="120" width="240" height="30" fill="url(#canal)"/>
  <path d="M10 136 h26 M60 142 h18 M190 138 h24 M150 144 h16" stroke="#8fb7b0" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <!-- narrowboat -->
  <g stroke="#0e0a06" stroke-width="2.5" stroke-linejoin="round">
    <path d="M40 124 H130 L138 130 L130 136 H44 Q36 136 36 130 Q36 124 40 124 Z" fill="#6d2a24"/>
    <rect x="58" y="116" width="54" height="9" fill="#2e4a3e"/>
    <rect x="112" y="118" width="10" height="7" fill="#b98c48"/>
  </g>
  <g fill="#f2c043"><rect x="64" y="118" width="5" height="4"/><rect x="76" y="118" width="5" height="4"/><rect x="88" y="118" width="5" height="4"/><rect x="100" y="118" width="5" height="4"/></g>
  <line x1="44" y1="130" x2="128" y2="130" stroke="#d9a441" stroke-width="1.5"/>
</svg>
