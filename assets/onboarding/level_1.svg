<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="A single small cottage with a thin chimney at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15121f"/>
      <stop offset="0.7" stop-color="#2b2130"/>
      <stop offset="1" stop-color="#3a2a26"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2217"/>
      <stop offset="1" stop-color="#17120c"/>
    </linearGradient>
  </defs>
  <rect width="240" height="150" fill="url(#sky)"/>
  <!-- first stars -->
  <g fill="#e9d9b4" opacity="0.55">
    <circle cx="36" cy="22" r="0.9"/><circle cx="182" cy="16" r="1.1"/><circle cx="208" cy="40" r="0.8"/><circle cx="92" cy="12" r="0.7"/>
  </g>
  <!-- a low moon -->
  <circle cx="196" cy="34" r="9" fill="#e6d3a3" opacity="0.8"/>
  <circle cx="200" cy="31" r="8" fill="#2b2130" opacity="0.9"/>
  <!-- far hill -->
  <path d="M0 108 Q60 88 120 100 T240 96 V150 H0 Z" fill="#231c19"/>
  <path d="M0 118 Q70 104 140 114 T240 110 V150 H0 Z" fill="url(#ground)" stroke="#0e0a06" stroke-width="2"/>
  <!-- the cottage -->
  <g stroke="#0e0a06" stroke-width="2.5" stroke-linejoin="round">
    <rect x="98" y="92" width="44" height="26" fill="#5b4632"/>
    <path d="M92 94 L120 72 L148 94 Z" fill="#3b2c20"/>
    <rect x="133" y="70" width="5" height="16" fill="#4a3a2a"/>
    <rect x="113" y="102" width="10" height="16" fill="#2a1d12"/>
    <rect x="102" y="99" width="8" height="8" fill="#c98e3a"/>
  </g>
  <rect x="103.5" y="100.5" width="5" height="5" fill="#f2c043" opacity="0.8"/>
  <!-- a thin wisp of smoke -->
  <path d="M135.5 68 C131 60 140 56 135 48 C131 42 138 38 135 32" fill="none" stroke="#9a9185" stroke-width="2.2" stroke-linecap="round" opacity="0.45"/>
  <!-- fence -->
  <g stroke="#0e0a06" stroke-width="2">
    <line x1="60" y1="116" x2="92" y2="113"/>
    <line x1="64" y1="110" x2="64" y2="118"/><line x1="72" y1="109" x2="72" y2="117"/><line x1="80" y1="109" x2="80" y2="116"/><line x1="88" y1="108" x2="88" y2="115"/>
  </g>
</svg>
